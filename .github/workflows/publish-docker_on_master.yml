name: Publish Latest Docker image

# Required repository secrets:
# - AWS_ACCESS_KEY_ID: AWS access key for ECR authentication
# - AWS_SECRET_ACCESS_KEY: AWS secret key for ECR authentication
# - AWS_REGION: AWS region for ECR (e.g., us-east-1)
# - DOCKER_USERNAME: Docker Hub username
# - DOCKER_PASSWORD: Docker Hub password
# Configure these under Settings → Secrets and variables → Actions

on:
  workflow_dispatch:
  push:
    branches: ['master']

jobs:
  push_to_registries:
    name: Push docker image to docker hub
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      -
        name: Checkout
        uses: actions/checkout@v3
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v2
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      -
        name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      -
        name: Login to Amazon ECR
        uses: docker/login-action@v2
        with:
          ecr: auto
          logout: true
      -
        name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push multi-architecture images
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/sakura_embyboss:latest
