name: Python Code Quality Check

on:
  push:
    branches: ['master', 'main', 'develop']
  pull_request:
    branches: ['master', 'main', 'develop']

jobs:
  lint:
    name: Check Python file standards
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install flake8
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Run flake8 on changed Python files
        run: |
          # Get list of changed Python files
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            CHANGED_FILES=$(git diff --name-only --diff-filter=ACM ${{ github.event.pull_request.base.sha }} ${{ github.sha }} | grep '\.py$' || true)
          else
            CHANGED_FILES=$(git diff --name-only --diff-filter=ACM HEAD~1 HEAD | grep '\.py$' || true)
          fi
          
          if [ -z "$CHANGED_FILES" ]; then
            echo "No Python files changed."
            exit 0
          fi
          
          echo "Checking Python files:"
          echo "$CHANGED_FILES"
          
          # Run flake8 on changed files
          echo "$CHANGED_FILES" | xargs flake8 --config=.flake8

      - name: Report success
        if: success()
        run: echo "✅ All Python files comply with code standards!"

      - name: Report failure
        if: failure()
        run: |
          echo "❌ Some Python files do not comply with code standards."
          echo "Please fix the issues reported above."
          exit 1
